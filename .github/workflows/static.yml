name: Deploy Origen Store to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Generar sitemap
        run: node scripts/generate-indexing.mjs
        env:
          SITE_URL: https://ripper-no-chart.github.io/origen-store

      - name: Compilar y prerenderizar Angular
        run: npm run build -- --configuration production --base-href /origen-store/

      - name: Preparar GitHub Pages
        run: |
          cp dist/origen-store/browser/404/index.html dist/origen-store/browser/404.html
          touch dist/origen-store/browser/.nojekyll

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/origen-store/browser

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
